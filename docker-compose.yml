services:
  postgres:
    image: postgres:16-alpine
    container_name: dangling_dice_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dangling_dice_api
      POSTGRES_USER: dds_user
      POSTGRES_PASSWORD: dds_password
    ports:
      - "5434:5432"
    volumes:
      - dds_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dds_user -d dangling_dice_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dangling_dice_api_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dds_api_pgdata:
